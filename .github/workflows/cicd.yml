name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

env:
  # Nguong chat luong cua lab. Dat tren f1_score, KHONG phai accuracy.
  F1_THRESHOLD: "0.65"
  # [Bonus 4] Bien do dao dong cho phep khi so voi model dang chay. F1 do tren
  # holdout 500 mau co sai so lay mau khoang +/- 0.03, nen so sanh ">=" tuyet doi
  # se chan release vi nhieu thong ke chu khong phai vi mo hinh xau di.
  ROLLBACK_TOLERANCE: "0.02"
  MODEL_KEY: "artifacts/current/model.joblib"
  REPORT_KEY: "artifacts/current/report.json"

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          # Cache thu muc pip giua cac lan chay: rut thoi gian cai dat
          # (mlflow + dvc rat nang) tu vai phut xuong vai chuc giay.
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc S3, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
      accuracy: ${{ steps.read_report.outputs.accuracy }}
      prev_f1: ${{ steps.previous_report.outputs.prev_f1 }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to Cloud Storage
        # Ghi credentials ra ~/.aws/ thay vi bien moi truong: ca boto3 va DVC
        # deu tu doc file nay, va gia tri khoa khong bi lot vao moi truong shell.
        env:
          STORAGE_CREDENTIALS: ${{ secrets.STORAGE_CREDENTIALS }}
        run: |
          python - <<'PYEOF'
          import json
          import os
          import pathlib

          creds = json.loads(os.environ["STORAGE_CREDENTIALS"])
          aws_dir = pathlib.Path.home() / ".aws"
          aws_dir.mkdir(parents=True, exist_ok=True)
          (aws_dir / "credentials").write_text(
              "[default]\n"
              f"aws_access_key_id = {creds['aws_access_key_id']}\n"
              f"aws_secret_access_key = {creds['aws_secret_access_key']}\n"
          )
          (aws_dir / "config").write_text(
              f"[default]\nregion = {creds.get('region', 'us-east-1')}\n"
          )
          print("Da ghi credentials vao ~/.aws/ - boto3 va DVC deu tu doc.")
          PYEOF

      - name: Pull data with DVC
        # Chi pull hai file can cho huan luyen; train_batch2.csv khong can tai ve.
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Read previous model report
        id: previous_report
        # [Bonus 4] Doc report.json cua model DANG CHAY tren S3 truoc khi ghi de.
        # Neu chua co (lan chay dau tien) thi tra ve "none".
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF' >> $GITHUB_OUTPUT
          import json
          import os
          import sys

          import boto3
          from botocore.exceptions import ClientError

          # Chi cac dong "khoa=gia tri" duoc phep ghi vao $GITHUB_OUTPUT.
          # Moi thong bao cho nguoi doc phai di ra stderr, neu khong GitHub Actions
          # bao "Invalid format" khi gap dong khong co dau "=".
          bucket = os.environ["ARTIFACT_BUCKET"]
          key = os.environ["REPORT_KEY"]
          try:
              body = boto3.client("s3").get_object(Bucket=bucket, Key=key)["Body"].read()
              prev = json.loads(body)
              print(f"prev_f1={prev['f1_score']}")
              print(f"Model dang chay co f1_score = {prev['f1_score']:.4f}", file=sys.stderr)
          except ClientError as exc:
              if exc.response["Error"]["Code"] not in ("NoSuchKey", "404", "NoSuchBucket"):
                  raise
              print("prev_f1=none")
              print("Chua co model tren S3 - lan trien khai dau tien.", file=sys.stderr)
          PYEOF

      - name: Train model
        run: python src/train.py

      - name: Read report
        id: read_report
        # Doc chi so tu outputs/report.json va dua ra output cua job de
        # job quality-gate doc duoc. Luu y: GitHub Actions outputs la kieu chuoi.
        run: |
          python - <<'PYEOF' >> $GITHUB_OUTPUT
          import json

          report = json.load(open("outputs/report.json"))
          print(f"f1={report['f1_score']}")
          print(f"accuracy={report['accuracy']}")
          PYEOF
          echo "--- outputs/report.json ---"
          cat outputs/report.json

      - name: Upload model to Cloud Storage
        # Upload model + report.json len s3://<bucket>/artifacts/current/.
        # serve.py tren EC2 tai dung duong dan nay moi khi service khoi dong lai.
        env:
          ARTIFACT_BUCKET: ${{ secrets.ARTIFACT_BUCKET }}
        run: |
          python - <<'PYEOF'
          import os

          import boto3

          s3 = boto3.client("s3")
          bucket = os.environ["ARTIFACT_BUCKET"]
          for local_path, key in [
              ("models/model.joblib", os.environ["MODEL_KEY"]),
              ("outputs/report.json", os.environ["REPORT_KEY"]),
          ]:
              s3.upload_file(local_path, bucket, key)
              print(f"Da upload {local_path} -> s3://{bucket}/{key}")
          PYEOF

      - name: Save report as artifact
        uses: actions/upload-artifact@v4
        with:
          name: report
          # [Bonus 3] Luu ca bao cao precision/recall chi tiet.
          path: |
            outputs/report.json
            outputs/detail.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE
  # Kiem tra nguong chat luong (f1_score >= 0.65).
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau.
  #
  # Luu y: nguong o day dat tren f1_score chu KHONG phai accuracy. Bo du lieu
  # Adult co ty le lop 75/25, nen mot mo hinh doan bua "thu nhap thap" cho moi
  # mau da dat accuracy 0.75 ma hoan toan vo dung.
  # Chi chay khi Job 2 (Train) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:

      - name: Check quality gate
        env:
          F1: ${{ needs.train.outputs.f1 }}
          ACCURACY: ${{ needs.train.outputs.accuracy }}
          PREV_F1: ${{ needs.train.outputs.prev_f1 }}
        run: |
          python - <<'PYEOF'
          import os

          # Outputs cua GitHub Actions la kieu chuoi -> phai float() truoc khi so sanh.
          f1 = float(os.environ["F1"])
          accuracy = float(os.environ["ACCURACY"])
          threshold = float(os.environ["F1_THRESHOLD"])
          tolerance = float(os.environ["ROLLBACK_TOLERANCE"])
          prev_raw = os.environ.get("PREV_F1", "none")

          print(f"f1_score = {f1:.4f} | accuracy = {accuracy:.4f} | nguong = {threshold}")

          # Cong 1: nguong chat luong tuyet doi.
          if f1 < threshold:
              raise SystemExit(
                  f"FAILED: f1_score {f1:.4f} < {threshold}. Huy trien khai.\n"
                  f"(accuracy {accuracy:.4f} co the van cao vi 75% mau thuoc lop am - "
                  f"day dung la ly do nguong dat tren F1.)"
              )

          # Cong 2 [Bonus 4]: khong trien khai model xau hon model dang chay.
          if prev_raw not in ("", "none"):
              prev_f1 = float(prev_raw)
              delta = f1 - prev_f1
              print(f"So voi model dang chay: {prev_f1:.4f} -> {f1:.4f} ({delta:+.4f})")
              if delta < -tolerance:
                  raise SystemExit(
                      f"FAILED: f1_score giam {abs(delta):.4f} so voi model dang chay "
                      f"({prev_f1:.4f}), vuot bien do cho phep {tolerance}. "
                      f"Giu nguyen model cu."
                  )
              print("Khong co suy giam dang ke so voi model dang chay.")
          else:
              print("Chua co model truoc do de so sanh - bo qua kiem tra regression.")

          print(f"PASSED: f1_score {f1:.4f} >= {threshold}. Dang trien khai model.")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len EC2 qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e

            # Restart service: serve.py tai lai model.joblib moi nhat tu S3
            # ngay khi khoi dong, nen restart la du de doi sang model moi.
            sudo systemctl restart income-api

            # Cho server san sang. Thu lai nhieu lan thay vi sleep co dinh de
            # khong that bai oan khi EC2 tai model cham hon binh thuong.
            for i in $(seq 1 10); do
              if curl -sf http://localhost:8080/healthz; then
                echo ""
                echo "Health check passed sau ${i} lan thu."
                exit 0
              fi
              echo "Lan thu ${i}/10 chua san sang, doi 3 giay..."
              sleep 3
            done

            echo "Health check FAILED. Log gan nhat cua service:"
            sudo journalctl -u income-api -n 40 --no-pager
            exit 1
